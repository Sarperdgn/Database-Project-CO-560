name: MariaDB 13.1 - Unix Socket Authentication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mariadb-socket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-socket:
    name: Passwordless OS identity and rejected unauthorized logins
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check Docker and Compose
        run: |
          docker --version
          docker compose version

      - name: Generate the project's Unix-socket implementation
        run: |
          bash apply-unix-socket-auth.sh
          test -f database/Dockerfile
          test -f database/init/03-unix-socket.sql
          test -f scripts/test-unix-socket-local.sh

      - name: Configure explicit MariaDB Unix-socket authentication
        run: |
          # MariaDB 11.6+ supports explicit mapping to the Linux OS identity.
          sed -i "s/IDENTIFIED VIA unix_socket;/IDENTIFIED VIA unix_socket AS 'project_socket';/" database/init/03-unix-socket.sql
          grep -Fq "IDENTIFIED VIA unix_socket AS 'project_socket';" database/init/03-unix-socket.sql

          # Fail startup if the server cannot initialize the Unix-socket plugin.
          cat >> database/Dockerfile <<'DOCKERFILE'
          RUN mkdir -p /etc/mysql/conf.d && \
              printf '%s\n' '[mariadb]' 'unix_socket=FORCE' > /etc/mysql/conf.d/99-unix-socket.cnf
          DOCKERFILE

      - name: Wait for account provisioning, not just database startup
        run: |
          # The repository's test script uses Compose automatically; COMPOSE_FILE
          # adds this CI-only healthcheck to its temporary Docker stack.
          cat > docker-compose.socket-ci.yml <<'COMPOSE'
          services:
            db:
              healthcheck:
                test:
                  - CMD-SHELL
                  - >-
                    MYSQL_PWD="$${MARIADB_ROOT_PASSWORD}" mariadb
                    --protocol=socket -uroot -Nse
                    "SELECT COUNT(*) FROM mysql.user WHERE User='project_socket' AND Host='localhost';"
                    | grep -qx 1
                interval: 2s
                timeout: 5s
                retries: 90
                start_period: 10s
          COMPOSE

      - name: Test passwordless login and rejected access
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.socket-ci.yml
        run: |
          set -o pipefail
          mkdir -p .ci-results
          bash scripts/test-unix-socket-local.sh 2>&1 | tee .ci-results/mariadb-socket.log

      - name: Show test evidence in the run summary
        if: success()
        run: |
          {
            echo '## MariaDB Unix-socket authentication'
            echo 'The container initialized its socket user, and the existing'
            echo 'integration tests verified permitted and denied operations.'
            echo ''
            echo '```text'
            grep -E '^(PASS|All Unix-socket)' .ci-results/mariadb-socket.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-unix-socket-output
          path: .ci-results/mariadb-socket.log
          if-no-files-found: ignore
          retention-days: 7
